name: Quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python tests and syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python sources and tests
        run: python -m compileall -q src tests

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Build downloadable release artifact
        run: scripts/build-release.sh dist

      - name: Verify downloadable release checksum
        run: |
          cd dist
          sha256sum -c SHA256SUMS

  shell:
    name: Shell syntax and ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Check shell syntax
        run: bash -n scripts/install-local.sh scripts/build-release.sh bin/gyte-lesson-kindle

      - name: Run ShellCheck
        run: shellcheck scripts/install-local.sh scripts/build-release.sh bin/gyte-lesson-kindle
