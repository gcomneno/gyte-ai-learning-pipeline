name: Publish Technical Preview

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION="$(
            PYTHONPATH=src python -c \
              'from gyte_study_tools import __version__; print(__version__)'
          )"
          EXPECTED_TAG="v${PACKAGE_VERSION}"

          echo "Release tag: $RELEASE_TAG"
          echo "Package version: $PACKAGE_VERSION"

          if [ "$RELEASE_TAG" != "$EXPECTED_TAG" ]; then
            echo "ERROR: tag $RELEASE_TAG does not match package version $PACKAGE_VERSION" >&2
            exit 1
          fi

          case "$PACKAGE_VERSION" in
            *-dev)
              echo "ERROR: refusing to publish a development version: $PACKAGE_VERSION" >&2
              exit 1
              ;;
          esac

          test -f "docs/release-notes-v${PACKAGE_VERSION}.md"

          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
          echo "ARCHIVE_NAME=gyte-ai-learning-pipeline-${PACKAGE_VERSION}.tar.gz" >> "$GITHUB_ENV"
          echo "RELEASE_NOTES=docs/release-notes-v${PACKAGE_VERSION}.md" >> "$GITHUB_ENV"

      - name: Compile Python sources and tests
        run: python -m compileall -q src tests

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Check shell syntax
        run: bash -n scripts/install-local.sh scripts/build-release.sh bin/gyte-lesson-kindle

      - name: Run ShellCheck
        run: shellcheck scripts/install-local.sh scripts/build-release.sh bin/gyte-lesson-kindle

      - name: Build downloadable release artifact
        run: scripts/build-release.sh dist

      - name: Verify downloadable release checksum
        run: |
          cd dist
          sha256sum -c SHA256SUMS

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "dist/$ARCHIVE_NAME" \
            "dist/SHA256SUMS" \
            --title "GYTE AI Learning Pipeline ${{ github.ref_name }} Technical Preview" \
            --notes-file "$RELEASE_NOTES" \
            --prerelease \
            --verify-tag
